<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Site Office</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Site Office">
<meta name="theme-color" content="#e8ebee">
<script>
  // Opened from the home screen: go straight to the app.
  (function () {
    var APP = "https://claude.ai/artifact/UwTmGfjKXpK1ggnqPmW8kd";
    var launched = /[?&]launch=1/.test(location.search) ||
      (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
      window.navigator.standalone === true;
    if (launched) location.replace(APP);
  })();
</script>
<style>
  :root { color-scheme: light dark; --bg: #e8ebee; --ink: #1a2026; --ink-2: #444e57; --accent: #1d4ec2; --accent-ink: #fff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111519; --ink: #e5e9ec; --ink-2: #aeb7be; --accent: #8fabff; --accent-ink: #0c1530; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; }
  main { max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  h1 { margin: 6px 0 0; font-size: 28px; }
  p { margin: 0; color: var(--ink-2); }
  a.btn { display: inline-block; margin-top: 6px; padding: 13px 22px; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="icon-192.png" alt="">
  <h1>Site Office</h1>
  <p>To put this on your home screen, open Chrome's menu and tap <b>Add to Home screen</b>. Tapping that icon opens your app.</p>
  <a class="btn" href="https://claude.ai/artifact/UwTmGfjKXpK1ggnqPmW8kd">Open Site Office</a>
</main>
</body>
</html>
